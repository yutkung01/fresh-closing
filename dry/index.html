<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dry Closing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --green: #06c755;
    --green-dark: #04a547;
    --green-soft: #e9f9ef;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f5f6f7;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: 'Sarabun', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: #e8710a;
    color: #fff;
    padding: 16px 16px 14px;
  }
  header .title { font-size: 19px; font-weight: 700; }
  header .sub { font-size: 14px; opacity: .9; }
  nav {
    display: none;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  nav.show { display: flex; }
  nav button {
    flex: 1; border: 0; background: none; font: inherit; font-weight: 600;
    padding: 12px 8px; color: var(--muted); border-bottom: 3px solid transparent;
  }
  nav button.active { color: var(--green-dark); border-bottom-color: var(--green); }
  main { padding: 16px; max-width: 520px; margin: 0 auto; }
  .card {
    background: var(--card); border-radius: 14px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .dept { font-size: 21px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 14px; }
  .q { font-weight: 700; margin-bottom: 10px; }
  .q span { color: var(--green-dark); margin-right: 6px; }
  .opt {
    display: block; width: 100%; text-align: left; font: inherit;
    background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 13px 14px; margin-bottom: 8px; color: var(--ink);
  }
  .opt.sel { border-color: var(--green); background: var(--green-soft); font-weight: 600; }
  .opt.sel.warn { border-color: var(--amber); background: var(--amber-soft); }
  .opt.sel.bad { border-color: var(--red); background: var(--red-soft); }
  .field { margin-top: 6px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; font: inherit; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px; background: #fff; color: var(--ink);
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--green); }
  .amt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .amt label { font-weight: 600; }
  .amt .plus label { color: var(--green-dark); }
  .amt .minus label { color: var(--red); }
  .net { margin-top: 10px; font-size: 15px; display: flex; justify-content: space-between; }
  .pos { color: var(--green-dark); }
  .neg { color: var(--red); }
  .alert { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .alert.warn { background: var(--amber-soft); color: var(--amber); }
  .alert.bad { background: var(--red-soft); color: var(--red); }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; font: inherit;
    font-weight: 700; padding: 15px; background: var(--green); color: #fff; font-size: 17px;
  }
  .btn:disabled { background: #c7cdd4; }
  .btn.ghost { background: #fff; color: var(--green-dark); border: 1.5px solid var(--green); margin-top: 10px; }
  .done-icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--green-soft);
    color: var(--green-dark); display: grid; place-items: center; font-size: 30px; margin: 4px auto 10px;
  }
  .center { text-align: center; }
  .rows { margin-top: 12px; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row b { text-align: right; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 14px; padding: 14px; }
  .stat .n { font-size: 24px; font-weight: 700; }
  .dl { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .dl:last-child { border-bottom: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex: none; }
  .dot.ok { background: var(--green); }
  .dot.issue { background: var(--amber); }
  .dl .grow { flex: 1; min-width: 0; }
  .dl .name { font-weight: 600; }
  .tag { font-size: 13px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.ok { background: var(--green-soft); color: var(--green-dark); }
  .tag.issue { background: var(--amber-soft); color: var(--amber); }
  .tag.wait { background: #f3f4f6; color: var(--muted); }
  .spinner {
    width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--green);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ph-h { font-weight: 600; margin: 14px 0 6px; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #f3f4f6; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .rm { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 26px; padding: 0; }
  .addph { aspect-ratio: 1; border: 1.5px dashed #c7cdd4; border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--green-dark); font-size: 26px; cursor: pointer; }
  .addph span { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .datenav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .datenav button { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line);
    background: #fff; font-size: 20px; color: var(--ink); }
  .datenav button:disabled { color: #c7cdd4; }
  .datenav input { flex: 1; min-width: 0; height: 44px; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 0 10px; font: inherit; background: #fff; color: var(--ink); }
  .dl.click { cursor: pointer; }
  .dl .chev { color: #c7cdd4; font-size: 18px; flex: none; }
  .back { border: 0; background: none; font: inherit; color: var(--green-dark); font-weight: 600; padding: 4px 0 12px; }
  .hist { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 14px; }
  .hist .it { position: relative; padding: 6px 0 10px; font-size: 14px; }
  .hist .it::before { content: ''; position: absolute; left: -21px; top: 11px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--green); }
  .hist .it.edit::before { background: var(--amber); }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center;
    z-index: 10; padding: 16px; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  .small { font-size: 13px; }
  .stat .n small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .lbl { font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips.col { flex-direction: column; }
  .chip { font: inherit; font-size: 15px; text-align: left; border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 10px; padding: 9px 12px; }
  .chips:not(.col) .chip { flex: 1; text-align: center; }
  .chip.sel { border-color: var(--green); background: var(--green-soft); font-weight: 600; }
  .chip.sel.pos { border-color: var(--green); color: var(--green-dark); }
  .chip.sel.neg, .chip.sel.warn { border-color: var(--red); background: var(--red-soft); color: var(--red); }
  .chip.sel.warn { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
  .adj { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; background: #fafafa; }
  .adj-h { display: flex; justify-content: space-between; align-items: center; }
  .adj .x { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 4px 8px; }
  .spinner.sm { margin: 0; width: 24px; height: 24px; }
</style>
</head>
<body>
<header>
  <div class="title">Dry Daily Closing</div>
  <div class="sub" id="hdr-sub">Gap · ปรับสต็อก · ป้ายราคา</div>
</header>
<nav id="tabs">
  <button data-tab="close" class="active">ปิดงานแผนก</button>
  <button data-tab="dash">ภาพรวมของแห้ง</button>
</nav>
<main id="view"></main>

<script>
/* ===== ตั้งค่า: ใส่ 2 ค่านี้ก่อนใช้งาน ===== */
const CONFIG = {
  LIFF_ID: '2012008671-Cnmobp3H',
  API_URL: 'https://script.google.com/macros/s/AKfycbzsCxVzLSf7GnOWEE4Hb1ZuBX8WDamcoa95qrBrqZwKNSIYmjD_hu93v86kpolA2I2_iw/exec',
};
/* ========================================== */

const SYSTEM = 'ของแห้ง';
const MAX_PHOTOS = 3;
const MAX_LINES = 6;
const REASONS = [
  ['neg_oh', 'ปรับ Negative On Hand', 'Negative OH'],
  ['not_found', 'สินค้าค้าง มี OH แต่หาของไม่เจอ', 'หาของไม่เจอ'],
  ['cycle', 'ปรับจากแมนนวลสต็อก', 'แมนนวลสต็อก'],
];
const REASON_SHORT = Object.fromEntries(REASONS.map(r => [r[0], r[2]]));

const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
const emptyForm = () => ({
  outShelf: '', outStock: '', hasAdj: null, lines: [],
  priceStatus: '', priceIssueCount: '', priceFixed: null, note: '',
});
const newLine = () => ({ reason: '', direction: '', amount: '', photos: [], keepFrom: '', keepCount: 0 });
const state = {
  me: null, tab: 'close', editing: false, submitting: false, preparing: false,
  form: emptyForm(), dashDate: null, detail: null, notify: null,
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const baht = n => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const num = v => Number(String(v ?? '').replace(/,/g, '')) || 0;
const isCount = v => /^\d+$/.test(String(v ?? '').replace(/,/g, '').trim());
const signed = n => n > 0 ? `<span class="pos">+฿${baht(n)}</span>` : n < 0 ? `<span class="neg">−฿${baht(-n)}</span>` : '฿0';
const lineAmt = a => a.direction === 'plus' ? `<span class="pos">+฿${baht(a.amount)}</span>` : `<span class="neg">−฿${baht(a.amount)}</span>`;
const thaiDate = iso => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
};
const isoAdd = (iso, days) => {
  const t = new Date(iso + 'T12:00:00Z');
  t.setUTCDate(t.getUTCDate() + days);
  return t.toISOString().slice(0, 10);
};
const isIssue = c => c && c.status && c.status !== 'เสร็จ';
const priceText = c => c.priceStatus === 'พบปัญหา'
  ? `พบปัญหา ${c.priceIssueCount} ป้าย · ${esc(c.priceFixed)}` : 'ครบและตรง';

function loading(msg) {
  view.innerHTML = `<div class="spinner"></div><p class="center muted">${esc(msg || 'กำลังโหลด...')}</p>`;
}

function showError(msg) {
  view.innerHTML = `
    <div class="card center">
      <div class="done-icon" style="background:var(--red-soft);color:var(--red)">!</div>
      <p>${esc(msg)}</p>
      <button class="btn" id="retry">ลองใหม่</button>
    </div>`;
  document.getElementById('retry').onclick = () => location.reload();
}

async function api(action, payload) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, idToken: liff.getIDToken(), payload }),
  });
  const json = await res.json();
  if (!json.ok) {
    if (json.code === 'TOKEN_INVALID' && !liff.isInClient()) liff.login({ redirectUri: location.href });
    const err = new Error(json.message || 'เกิดข้อผิดพลาด');
    err.code = json.code;
    throw err;
  }
  return json.data;
}

/* ---------- Tabs ---------- */
tabs.addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  state.detail = null;
  [...tabs.children].forEach(x => x.classList.toggle('active', x === b));
  render();
});

function render() {
  const me = state.me;
  if (!me.registered) return renderPending();
  if (state.detail) return renderDetail();
  if (me.role === 'manager' || state.tab === 'dash') return renderDashboard();
  if (me.closing && !state.editing) return renderDone();
  return renderForm();
}

function renderPending() {
  tabs.classList.remove('show');
  const inactive = state.me.reason === 'inactive';
  view.innerHTML = `
    <div class="card center">
      <div class="done-icon">${inactive ? '–' : '⏳'}</div>
      <div class="dept">${inactive ? 'บัญชีถูกปิดการใช้งาน' : 'ลงทะเบียนเรียบร้อย'}</div>
      <p class="muted">คุณ ${esc(state.me.name)}<br>
      ${inactive ? 'กรุณาติดต่อผู้ดูแลระบบ' : 'รอผู้ดูแลกำหนดแผนกให้ แล้วเปิดลิงก์นี้อีกครั้ง'}</p>
    </div>`;
}

/* ---------- ฟอร์มปิดงาน ---------- */
function formValid() {
  const f = state.form;
  if (state.submitting || state.preparing) return false;
  if (!isCount(f.outShelf) || !isCount(f.outStock)) return false;
  if (f.hasAdj === null) return false;
  if (f.hasAdj) {
    if (!f.lines.length) return false;
    for (const l of f.lines) {
      if (!l.reason || !l.direction || num(l.amount) <= 0) return false;
      if (!l.photos.length && !l.keepFrom) return false;
    }
  }
  if (!f.priceStatus) return false;
  if (f.priceStatus === 'issue' && (!isCount(f.priceIssueCount) || num(f.priceIssueCount) < 1 || f.priceFixed === null)) return false;
  return true;
}

function missingFields() {
  const f = state.form;
  const m = [];
  if (!isCount(f.outShelf)) m.push('Out Shelf');
  if (!isCount(f.outStock)) m.push('Out Stock');
  if (f.hasAdj === null) m.push('เลือกว่ามีการปรับสต็อกหรือไม่');
  if (f.hasAdj) f.lines.forEach((l, i) => {
    const n = 'รายการปรับที่ ' + (i + 1) + ': ';
    if (!l.reason) m.push(n + 'สาเหตุ');
    if (!l.direction) m.push(n + 'ปรับเพิ่ม/ลด');
    if (num(l.amount) <= 0) m.push(n + 'มูลค่า');
    if (!l.photos.length && !l.keepFrom) m.push(n + 'รูปหลักฐาน');
  });
  if (!f.priceStatus) m.push('ผลตรวจป้ายราคา');
  if (f.priceStatus === 'issue') {
    if (!isCount(f.priceIssueCount) || num(f.priceIssueCount) < 1) m.push('จำนวนป้ายที่มีปัญหา');
    if (f.priceFixed === null) m.push('แก้ป้ายแล้วหรือยัง');
  }
  return m;
}

function refreshSubmit() {
  const b = document.getElementById('submit');
  if (b) b.disabled = !formValid();
  const box = document.getElementById('missing');
  if (box) {
    const m = state.submitting || state.preparing ? [] : missingFields();
    box.style.display = m.length ? 'block' : 'none';
    box.innerHTML = m.length ? 'ยังกรอกไม่ครบ: ' + m.map(esc).join(' · ') : '';
  }
  const net = document.getElementById('net');
  if (net) {
    const n = state.form.lines.reduce((s, l) => s + (l.direction === 'plus' ? 1 : l.direction === 'minus' ? -1 : 0) * num(l.amount), 0);
    net.innerHTML = signed(Math.round(n * 100) / 100);
  }
}

function lineCard(l, i) {
  const chip = (field, value, label, cls = '') =>
    `<button class="chip ${l[field] === value ? 'sel ' + cls : ''}" data-line="${i}" data-f="${field}" data-v="${value}">${label}</button>`;
  const usingOld = !l.photos.length && l.keepFrom;
  return `
    <div class="adj">
      <div class="adj-h"><b>รายการปรับที่ ${i + 1}</b><button class="x" data-del="${i}" aria-label="ลบรายการ">✕</button></div>
      <div class="lbl">สาเหตุ</div>
      <div class="chips col">${REASONS.map(r => chip('reason', r[0], r[1])).join('')}</div>
      <div class="lbl">ประเภท</div>
      <div class="chips">${chip('direction', 'plus', 'ปรับเพิ่ม (+)', 'pos')}${chip('direction', 'minus', 'ปรับลด (−)', 'neg')}</div>
      <div class="field"><label>มูลค่า (บาท)</label>
        <input inputmode="decimal" placeholder="เช่น 1250" data-amt="${i}" value="${esc(l.amount)}"></div>
      <div class="lbl">📷 รูปหลักฐาน <span class="muted">(อย่างน้อย 1 รูป สูงสุด ${MAX_PHOTOS})</span></div>
      ${usingOld ? `<div class="muted small">ใช้รูปเดิม ${l.keepCount} รูป · ถ้าเลือกรูปใหม่ จะแทนที่รูปเดิม</div>` : ''}
      <div class="pgrid">
        ${l.photos.map((u, j) => `<div class="ph"><img src="${u}" alt=""><button class="rm" data-rmph="${i}:${j}" aria-label="ลบรูป">✕</button></div>`).join('')}
        ${l.photos.length < MAX_PHOTOS ? `
          <label class="addph">${state.preparing ? '<div class="spinner sm"></div><span>กำลังเตรียมรูป</span>' : '＋<span>ถ่าย / เลือกรูป</span>'}
            <input type="file" accept="image/*" multiple data-pick="${i}" hidden ${state.preparing ? 'disabled' : ''}>
          </label>` : ''}
      </div>
    </div>`;
}

function renderForm() {
  const f = state.form;
  const me = state.me;
  const opt = (group, value, label, cls = '') =>
    `<button class="opt ${f[group] === value ? 'sel ' + cls : ''}" data-g="${group}" data-v="${String(value)}">${label}</button>`;

  view.innerHTML = `
    <div class="card">
      <div class="muted">${esc(thaiDate(me.businessDate))}</div>
      <div class="dept">${esc(me.department)}</div>
      <div class="muted">ผู้ปิดงาน: ${esc(me.name)}${state.editing ? ' · <b style="color:var(--amber)">กำลังแก้ไข</b>' : ''}</div>
    </div>

    <div class="card">
      <div class="q"><span>01</span>Gap สินค้า (จำนวนรายการ)</div>
      <div class="amt">
        <div class="field"><label>Out Shelf</label>
          <input id="outShelf" inputmode="numeric" placeholder="กรอกจำนวน" value="${esc(f.outShelf)}"></div>
        <div class="field"><label>Out Stock</label>
          <input id="outStock" inputmode="numeric" placeholder="กรอกจำนวน" value="${esc(f.outStock)}"></div>
      </div>
      <div class="muted small" style="margin-top:6px">Out Shelf = มีของหลังบ้านแต่ยังไม่ได้เติม · Out Stock = สต็อกเป็น 0 · ไม่มีให้ใส่ 0</div>
    </div>

    <div class="card">
      <div class="q"><span>02</span>การปรับสต็อก</div>
      ${opt('hasAdj', false, 'ไม่มีการปรับสต็อก')}
      ${opt('hasAdj', true, 'มีการปรับสต็อก')}
      ${f.hasAdj ? `
        ${f.lines.map(lineCard).join('')}
        ${f.lines.length < MAX_LINES ? `<button class="btn ghost" id="addline" style="margin-top:4px">＋ เพิ่มรายการปรับ</button>` : ''}
        <div class="net muted"><span>ยอดปรับสุทธิ</span><b id="net"></b></div>` : ''}
    </div>

    <div class="card">
      <div class="q"><span>03</span>ตรวจเช็กป้ายราคา</div>
      ${opt('priceStatus', 'ok', '✅ ครบและตรง')}
      ${opt('priceStatus', 'issue', '⚠️ พบป้ายไม่ครบ / ไม่ตรง', 'warn')}
      ${f.priceStatus === 'issue' ? `
        <div class="field"><label>จำนวนป้ายที่มีปัญหา</label>
          <input id="priceCount" inputmode="numeric" placeholder="เช่น 3" value="${esc(f.priceIssueCount)}"></div>
        <div class="chips" style="margin-top:8px">
          <button class="chip ${f.priceFixed === true ? 'sel' : ''}" data-fixed="1">แก้ไขแล้ว</button>
          <button class="chip ${f.priceFixed === false ? 'sel warn' : ''}" data-fixed="0">ยังไม่แก้</button>
        </div>` : ''}
    </div>

    <div class="card">
      <div class="field" style="margin-top:0"><label>หมายเหตุ (ไม่บังคับ)</label>
        <textarea id="note" rows="2" maxlength="300" placeholder="เช่น รอสินค้าเข้าวันพรุ่งนี้">${esc(f.note)}</textarea></div>
    </div>

    <div id="missing" class="alert warn" style="margin-bottom:10px;display:none"></div>
    <button class="btn" id="submit">${state.submitting ? 'กำลังอัปโหลดรูปและบันทึก...' : state.editing ? 'บันทึกการแก้ไข' : 'ยืนยันปิดงาน'}</button>
    ${state.editing ? `<button class="btn ghost" id="cancel">ยกเลิกการแก้ไข</button>` : ''}
  `;

  view.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const g = b.dataset.g;
    let v = b.dataset.v;
    if (g === 'hasAdj') {
      v = v === 'true';
      if (v && !f.lines.length) f.lines.push(newLine());
    }
    f[g] = v;
    renderForm();
  });
  view.querySelectorAll('.chip[data-line]').forEach(b => b.onclick = () => {
    f.lines[Number(b.dataset.line)][b.dataset.f] = b.dataset.v;
    renderForm();
  });
  view.querySelectorAll('[data-fixed]').forEach(b => b.onclick = () => { f.priceFixed = b.dataset.fixed === '1'; renderForm(); });
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    f.lines.splice(Number(b.dataset.del), 1);
    if (!f.lines.length) f.hasAdj = null;
    renderForm();
  });
  view.querySelectorAll('[data-rmph]').forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.rmph.split(':').map(Number);
    f.lines[i].photos.splice(j, 1);
    renderForm();
  });
  view.querySelectorAll('[data-pick]').forEach(inp => inp.onchange = () => {
    addPhotos(Number(inp.dataset.pick), inp.files);
    inp.value = '';
  });
  view.querySelectorAll('[data-amt]').forEach(inp => inp.oninput = () => {
    inp.value = inp.value.replace(/[^\d.,]/g, '');
    f.lines[Number(inp.dataset.amt)].amount = inp.value;
    refreshSubmit();
  });
  const bindNum = (id, key) => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => { el.value = el.value.replace(/[^\d]/g, ''); f[key] = el.value; refreshSubmit(); };
  };
  bindNum('outShelf', 'outShelf');
  bindNum('outStock', 'outStock');
  bindNum('priceCount', 'priceIssueCount');
  const note = document.getElementById('note');
  note.oninput = () => { f.note = note.value; };
  const add = document.getElementById('addline');
  if (add) add.onclick = () => { f.lines.push(newLine()); renderForm(); };
  document.getElementById('submit').onclick = submit;
  const cancel = document.getElementById('cancel');
  if (cancel) cancel.onclick = () => { state.editing = false; render(); };
  refreshSubmit();
}

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('เปิดไฟล์รูปนี้ไม่ได้'));
      i.src = url;
    });
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k);
    c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function addPhotos(i, files) {
  const line = state.form.lines[i];
  const room = MAX_PHOTOS - line.photos.length;
  const list = [...files].slice(0, room);
  if (files.length > room) alert(`แนบได้สูงสุด ${MAX_PHOTOS} รูปต่อรายการ`);
  if (!list.length) return;
  state.preparing = true;
  renderForm();
  try {
    for (const file of list) line.photos.push(await compressImage(file));
  } catch (e) {
    alert(e.message);
  } finally {
    state.preparing = false;
    renderForm();
  }
}

async function submit() {
  const f = state.form;
  state.submitting = true;
  renderForm();
  try {
    const data = await api('submit', {
      outShelf: f.outShelf,
      outStock: f.outStock,
      adjustments: f.hasAdj ? f.lines.map(l => ({
        reason: l.reason, direction: l.direction, amount: l.amount,
        photos: l.photos, keepFrom: l.photos.length ? '' : l.keepFrom,
      })) : [],
      priceStatus: f.priceStatus,
      priceIssueCount: f.priceStatus === 'issue' ? f.priceIssueCount : '',
      priceFixed: f.priceStatus === 'issue' ? f.priceFixed : null,
      note: f.note,
    });
    state.me.closing = data.closing;
    state.editing = false;
    state.submitting = false;
    state.notify = 'sending';
    render();
    state.notify = await notifyGroup(data);
    if (state.me.closing === data.closing && !state.editing && !state.detail && state.tab === 'close') render();
  } catch (e) {
    state.submitting = false;
    alert(e.message);
    render();
  }
}

/* ---------- แจ้งเตือนเข้ากลุ่ม (ส่งในนามผู้ปิดงาน ไม่กินโควตา OA) ---------- */
function groupMessage(data) {
  const c = data.closing;
  const p = data.progress;
  const plain = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const lines = [
    `${data.edited ? '✏️ แก้ไขผลปิดงาน' : isIssue(c) ? '⚠️ ปิดงาน' : '✅ ปิดงาน'} ${c.department} แล้ว`,
    `👤 ${c.name} · ${data.edited ? c.updatedAt : c.submittedAt} น.`,
    `🕳 Gap: Out Shelf ${c.outShelf} · Out Stock ${c.outStock} รายการ`,
  ];
  if (c.adjustments.length) {
    lines.push(`📦 ปรับสต็อก ${c.adjustments.length} รายการ`);
    c.adjustments.forEach(a => lines.push(`   • ${REASON_SHORT[a.reason]} ${a.direction === 'plus' ? '+' : '−'}฿${plain(a.amount)} 📷${a.photoCount}`));
  } else {
    lines.push('📦 ปรับสต็อก: ไม่มี');
  }
  lines.push(c.priceStatus === 'พบปัญหา'
    ? `🏷 ป้ายราคา: พบปัญหา ${c.priceIssueCount} ป้าย (${c.priceFixed})`
    : '🏷 ป้ายราคา: ครบและตรง');
  if (c.note) lines.push(`📝 ${c.note}`);
  const nPh = (data.groupPhotos || []).length;
  if (nPh) lines.push(`📷 รูปหลักฐาน ${nPh} รูป (เรียงตามรายการปรับด้านบน)`);
  lines.push('━━━━━━━━━━');
  if (!p.pending.length) {
    lines.push(`🎉 ปิดครบ ${p.doneCount}/${p.totalDepartments} แผนกแล้ว`);
  } else {
    lines.push(`ปิดแล้ว ${p.doneCount}/${p.totalDepartments}`);
    lines.push(`⏳ ยังไม่ปิด: ${p.pending.join(', ')}`);
  }
  return lines.join('\n');
}

async function notifyGroup(data) {
  state.lastNotify = data;
  state.notifyWhy = '';
  try {
    if (!data.progress) return 'skip';
    if (!liff.isInClient()) {
      state.notifyWhy = 'เปิดลิงก์นอกแอป LINE บนมือถือ (เช่น LINE บนคอมพิวเตอร์ หรือเบราว์เซอร์)';
      return 'skip';
    }
    const ctx = liff.getContext();
    if (!ctx || !['group', 'room'].includes(ctx.type)) {
      const where = { utou: 'แชทส่วนตัว', external: 'นอกห้องแชท (เช่น Keep / ลิงก์ภายนอก)', none: 'นอกห้องแชท' }[ctx && ctx.type] || (ctx && ctx.type) || 'ไม่ทราบ';
      state.notifyWhy = 'เปิดลิงก์จาก' + where + ' ไม่ใช่จากในกลุ่ม';
      return 'skip';
    }
    await liff.sendMessages([{ type: 'text', text: groupMessage(data) }]);
    // ส่งรูปหลักฐานตามหลังข้อความ (ครั้งละไม่เกิน 5 รูป)
    state.photoFail = false;
    const imgs = photoMessages(data);
    for (let i = 0; i < imgs.length; i += 5) {
      try { await liff.sendMessages(imgs.slice(i, i + 5)); }
      catch (e) { console.warn('send photos failed', e); state.photoFail = true; break; }
    }
    return 'sent';
  } catch (e) {
    console.warn('sendMessages failed', e);
    const msg = String((e && (e.code || '')) + ' ' + (e && e.message || e)).trim();
    state.notifyWhy = /403|permission|scope|consent/i.test(msg)
      ? 'ยังไม่ได้อนุญาตสิทธิ์ส่งข้อความ (' + msg + ') · ปิดหน้านี้ แล้วเปิดลิงก์จากกลุ่มใหม่ และกด "อนุญาต"'
      : msg;
    return 'fail';
  }
}

function photoMessages(data) {
  return (data.groupPhotos || []).map(p => ({ type: 'image', originalContentUrl: p.original, previewImageUrl: p.preview }));
}

function notifyBox() {
  const n = state.notify;
  if (!n) return '';
  if (n === 'sending') return `<div class="alert" style="background:#f3f4f6;color:var(--muted);margin:-4px 0 12px">กำลังส่งแจ้งเตือนเข้ากลุ่ม...</div>`;
  if (n === 'sent') return `<div class="alert" style="background:var(--green-soft);color:var(--green-dark);margin:-4px 0 12px">📣 ส่งแจ้งเตือนเข้ากลุ่มแล้ว${state.photoFail ? ' (แต่ส่งรูปไม่สำเร็จ ดูรูปได้ในระบบ)' : ''}</div>`;
  const canShare = liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker');
  return `
    <div class="alert warn" style="margin:-4px 0 12px">
      <b>บันทึกสำเร็จ แต่ยังไม่ได้ส่งแจ้งเตือนเข้ากลุ่ม</b><br>
      สาเหตุ: ${esc(state.notifyWhy || 'ไม่ทราบ')}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        ${n === 'fail' ? `<button class="chip" id="nf-retry">ส่งอีกครั้ง</button>` : ''}
        ${canShare ? `<button class="chip" id="nf-share">เลือกกลุ่มแล้วส่ง</button>` : ''}
        <button class="chip" id="nf-copy">คัดลอกข้อความ</button>
      </div>
    </div>`;
}

function bindNotifyBox(rerender) {
  const data = state.lastNotify;
  if (!data) return;
  const retry = document.getElementById('nf-retry');
  if (retry) retry.onclick = async () => { state.notify = 'sending'; rerender(); state.notify = await notifyGroup(data); rerender(); };
  const share = document.getElementById('nf-share');
  if (share) share.onclick = async () => {
    try {
      const r = await liff.shareTargetPicker([{ type: 'text', text: groupMessage(data) }].concat(photoMessages(data).slice(0, 4)));
      if (r) { state.notify = 'sent'; rerender(); }
    } catch (e) { alert('ส่งไม่สำเร็จ: ' + (e.message || e)); }
  };
  const copy = document.getElementById('nf-copy');
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(groupMessage(data)); copy.textContent = 'คัดลอกแล้ว ✓'; }
    catch (e) { prompt('คัดลอกข้อความนี้ไปวางในกลุ่ม', groupMessage(data)); }
  };
}

function reasonRows(b) {
  const rows = REASONS.filter(r => b[r[0]] && b[r[0]].count).map(r => {
    const x = b[r[0]];
    return `<div class="row"><span>${r[2]} · ${x.count} รายการ</span><b>${signed(x.net)}</b></div>`;
  });
  return rows.length ? rows.join('') : `<div class="row"><span class="muted">ไม่มีการปรับ</span><b></b></div>`;
}

/* ---------- รายละเอียดแผนก ---------- */
function openDetail(date, department) {
  state.detail = { date, department };
  window.scrollTo(0, 0);
  render();
}

function closeDetail() {
  state.detail = null;
  render();
}

function zoom(src) {
  const z = document.createElement('div');
  z.className = 'zoom';
  z.innerHTML = `<img src="${src}" alt="รูปหลักฐาน">`;
  z.onclick = () => z.remove();
  document.body.appendChild(z);
}

async function renderDetail() {
  const want = state.detail;
  loading('กำลังโหลดรายละเอียดและรูป...');
  try {
    const d = await api('detail', want);
    if (state.detail !== want) return;
    const c = d.closing;
    view.innerHTML = `
      <button class="back" id="back">‹ กลับ</button>
      <div class="card">
        <div class="muted">${esc(thaiDate(d.date))}</div>
        <div class="dept">${esc(d.department)}</div>
        ${c ? `<span class="tag ${isIssue(c) ? 'issue' : 'ok'}">${esc(c.status)}</span>` : '<span class="tag wait">ยังไม่ปิดงาน</span>'}
        ${c ? `<div class="rows">${closingRows(c)}</div>` : ''}
      </div>
      ${c && c.adjustments.length ? c.adjustments.map((a, i) => `
        <div class="card">
          <div class="q" style="margin-bottom:4px">📦 ปรับ ${i + 1}: ${esc(REASONS.find(r => r[0] === a.reason)?.[1] || a.reason)}</div>
          <div class="row" style="border-bottom:0"><span>${a.direction === 'plus' ? 'ปรับเพิ่ม' : 'ปรับลด'}</span><b>${lineAmt(a)}</b></div>
          ${a.photos && a.photos.length
            ? `<div class="pgrid">${a.photos.map(u => `<div class="ph"><img src="${u}" alt="รูปหลักฐาน" data-zoom></div>`).join('')}</div>`
            : `<div class="muted">ไม่มีรูป (อาจถูกลบออกจาก Drive)</div>`}
        </div>`).join('') + `<div class="muted small" style="margin:-6px 0 12px">แตะที่รูปเพื่อดูขนาดเต็ม</div>` : ''}
      ${d.history.length ? `
      <div class="card">
        <div class="q">🕘 ประวัติการบันทึก</div>
        <div class="hist">
          ${d.history.map(h => `
            <div class="it ${h.action === 'edit' ? 'edit' : ''}">
              <b>${esc(h.time)} น. · ${h.action === 'edit' ? 'แก้ไข' : 'ปิดงาน'}</b> <span class="muted">โดย ${esc(h.name)}</span>
              <div class="muted">OS ${h.outShelf} · OOS ${h.outStock} · ป้าย ${esc(h.priceStatus)}${h.priceIssueCount ? ' ' + h.priceIssueCount + ' ป้าย (' + esc(h.priceFixed) + ')' : ''}</div>
              <div class="muted">${h.adjustments.length
                ? h.adjustments.map(a => `${esc(REASON_SHORT[a.reason] || a.reason)} ${lineAmt(a)} 📷${a.photoCount}`).join(' · ')
                : 'ไม่มีการปรับ'}</div>
              ${h.note ? `<div class="muted">📝 ${esc(h.note)}</div>` : ''}
            </div>`).join('')}
        </div>
      </div>` : ''}
    `;
    document.getElementById('back').onclick = closeDetail;
    view.querySelectorAll('[data-zoom]').forEach(img => img.onclick = () => zoom(img.src));
  } catch (e) {
    view.innerHTML = `<button class="back" id="back">‹ กลับ</button><div class="card center"><p>${esc(e.message)}</p></div>`;
    document.getElementById('back').onclick = closeDetail;
  }
}

/* ---------- เริ่มต้น ---------- */
(async function init() {
  loading('กำลังเชื่อมต่อ LINE...');
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
      return;
    }
    loading('กำลังโหลดข้อมูล...');
    state.me = await api('me');
    if (state.me.registered && state.me.role === 'supervisor') tabs.classList.add('show');
    if (state.me.registered) {
      document.getElementById('hdr-sub').textContent =
        state.me.role === 'manager' ? 'ภาพรวมสำหรับผู้จัดการ' : 'Gap · ปรับสต็อก · ป้ายราคา';
    }
    render();
  } catch (e) {
    console.error(e);
    showError(e.message || 'เปิดระบบไม่สำเร็จ');
  }
})();
</script>
</body>
</html>
